name: agriplant
description: Agriculture plant app
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_iconly: ^1.0.2
  google_fonts: ^6.2.1
  badges: ^3.1.1
  timelines: ^0.1.0
  easy_stepper: ^0.8.5+1
  supabase_flutter: ^2.3.4
  url_launcher: ^6.3.1
  sqflite: ^2.4.1
  image_picker: ^1.1.2
  path: ^1.9.0
  intl: ^0.20.2
  flutter_gen: ^5.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/services/
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: "AppIcon"
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true